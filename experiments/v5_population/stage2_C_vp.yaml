# Stage 2 of 2: each learner against the other three learners' stage-1 policies (frozen).
# Learner C: double the reward per VP. Only the learner trains. See ../README.md.
name: v5_stage2_C_vp
seed: 22
init_policy: v5_stage1_C_vp  # this learner's newest stage-1 policy
ppo:
  total_steps: 1000000
  rollout_steps: 4096
  minibatch: 512
  epochs: 4
  lr: 0.00025
  hidden: [512, 256]
  vp_reward_scale: 0.1
  entropy_coef: 0.01
  fast_win_bonus: 0.5
  fast_win_turns: 200
  num_envs: 2
league:
  fixed_opponents: [policy:v5_stage1_A_base, policy:v5_stage1_B_nobonus, policy:v5_stage1_D_explore]
  lineup: true
  self_play_prob: 0.0
  snapshot_every: 10000000  # unused without self-play
eval_every: 100000
eval_games: 40
eval_opponents: [policy:v5_stage1_A_base, policy:v5_stage1_B_nobonus, policy:v5_stage1_D_explore]
