# Run with: catan experiment run experiments/v7_baseline/experiment.yaml
# (v7 itself was run by hand before the runner existed; this file reproduces it and is the
# template for later experiments.)
name: v7_baseline
description: >
  The conventional self-play baseline: one continuous 20M-step run per seed against the
  current policy (50%), a 40-snapshot history (30%) and fixed opponents (20%).
comparison: >
  Primary: reference rating (reference_v1) of the three finals, mean and 95% interval over
  seeds. Secondary: VP margin and mean rank against 3x greedy vs v6 stage 2's four finals
  (400 games). Better = the three-seed VP-margin interval against 3x greedy lies entirely
  above v6's.
runs: [baseline_s1.yaml, baseline_s2.yaml, baseline_s3.yaml]
max_resumes: 3
analysis:
  health: true
  curve:
    every: 2000000
    games: 200
    seed: 5000
    lineups:
      greedy3: [greedy, greedy, greedy]
      mix: [random, random, greedy]
  rate:
    reference: experiments/reference.yaml
    every: 2000000
    games: 400
  compare:
    groups:
      v7: self
      v6s2: [37c99e2fac, e2f768b3ab, cb5cb1c5ef, cb4614a1f1]
    lineups:
      greedy3: [greedy, greedy, greedy]
      mix: [random, random, greedy]
    games: 400
    seed: 6000
  workers: 8
