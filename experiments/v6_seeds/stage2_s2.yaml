# Stage 2 of 2: each learner against the other three (frozen), with ~25% random seats mixed in
# against overfitting (each seat drawn from the three peers + random).
# All four learners use identical settings (v5 learner C's); only the seed differs.
# Only the learner trains. See ../README.md.
name: v6_stage2_s2
seed: 41
init_policy: v6_stage1_s2  # this learner's newest stage-1 policy
ppo:
  total_steps: 1000000
  rollout_steps: 4096
  minibatch: 512
  epochs: 4
  lr: 0.00025
  hidden: [512, 256]
  vp_reward_scale: 0.1
  entropy_coef: 0.01
  fast_win_bonus: 0.5
  fast_win_turns: 200
  num_envs: 2
league:
  fixed_opponents: [policy:v6_stage1_s1, policy:v6_stage1_s3, policy:v6_stage1_s4, random]  # pool: each seat drawn uniformly
  lineup: false
  self_play_prob: 0.0
  snapshot_every: 10000000  # unused without self-play
eval_every: 100000
eval_games: 40
checkpoint_every: 200000  # for `catan curve` (overfitting check)
eval_opponents: [policy:v6_stage1_s1, policy:v6_stage1_s3, policy:v6_stage1_s4]
